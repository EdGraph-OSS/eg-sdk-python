name: Publish Package

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  id-token: write 

jobs:
  publish-package:
    runs-on: ubuntu-latest

    steps:
      - name: ⚙️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 📦 Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: 🏗️ Build distribution
        run: python -m build

      - name: 🚀 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1 # using https://pypi.org/manage/projects/ with elvisedgraph account